# Replace 10.0.2.20 with EC2-2's private IP before copying this file to the host.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://10.0.2.20:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
